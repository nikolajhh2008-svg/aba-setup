    <path class="t1" d="M347 319.5 l3.6 3.6 l6.6 -7.2" fill="none" stroke="#12181A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="370" y="324.5" font-size="15.5" fill="#F3EEE4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600">Schreibt mit dir</text>
  </g>
  <g class="c2">
    <rect x="72" y="352" width="196" height="38" rx="19" fill="#1E2729" stroke="#4A5A5E"/>
    <circle cx="92" cy="371" r="10" fill="#6FBF8A"/>
    <path class="t2" d="M87 371.5 l3.6 3.6 l6.6 -7.2" fill="none" stroke="#12181A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="376.5" font-size="15.5" fill="#F3EEE4" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600">Protokoll läuft mit</text>
  </g>
  <g class="c3">
    <rect x="280" y="352" width="228" height="38" rx="19" fill="#1E2729" stroke="#4A5A5E"/>
    <circle cx="300" cy="371" r="10" fill="#6FBF8A"/>
    <path class="t3" d="M295 371.5 l3.6 3.6 l6.6 -7.2" fill="none" stroke="#12181A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
