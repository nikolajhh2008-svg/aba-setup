    <line class="l4" x1="820" y1="262" x2="1142" y2="262" stroke="#F3EEE4" stroke-opacity="0.72" stroke-width="3.2" stroke-linecap="round" pathLength="1"/>
    <line class="l5" x1="820" y1="290" x2="1110" y2="290" stroke="#F3EEE4" stroke-opacity="0.72" stroke-width="3.2" stroke-linecap="round" pathLength="1"/>
    <line class="l6" x1="820" y1="318" x2="1000" y2="318" stroke="#F3EEE4" stroke-opacity="0.72" stroke-width="3.2" stroke-linecap="round" pathLength="1"/>
    
