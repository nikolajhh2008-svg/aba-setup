<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">ABA-Setup</title>
  <desc id="d">Ein Blatt füllt sich Zeile für Zeile, eine Feder schreibt mit, daneben haken sich die vier Regeln ab: keine erfundenen Quellen, schreibt mit dir, Protokoll läuft mit, sauber gekennzeichnet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12181A"/><stop offset="1" stop-color="#1A2326"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#A9B4AE" fill-opacity="0.18"/></pattern>
  </defs>
  <style>
    @keyframes w0 { 0%,4.00% { stroke-dashoffset: 1; } 11.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l0 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w0 9s linear infinite; }
    @keyframes w1 { 0%,12.00% { stroke-dashoffset: 1; } 19.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l1 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w1 9s linear infinite; }
    @keyframes w2 { 0%,20.00% { stroke-dashoffset: 1; } 27.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w2 9s linear infinite; }
    @keyframes w3 { 0%,28.00% { stroke-dashoffset: 1; } 35.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l3 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w3 9s linear infinite; }
    @keyframes w4 { 0%,36.00% { stroke-dashoffset: 1; } 43.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l4 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w4 9s linear infinite; }
    @keyframes w5 { 0%,44.00% { stroke-dashoffset: 1; } 51.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l5 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w5 9s linear infinite; }
    @keyframes w6 { 0%,52.00% { stroke-dashoffset: 1; } 59.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 1; } }
    .l6 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: w6 9s linear infinite; }
    @keyframes pen { 0% { transform: translate(0px,0px); } 4.00% { transform: translate(0px,0px); } 11.00% { transform: translate(330px,0px); } 12.00% { transform: translate(0px,28px); } 19.00% { transform: translate(300px,28px); } 20.00% { transform: translate(0px,56px); } 27.00% { transform: translate(338px,56px); } 28.00% { transform: translate(0px,84px); } 35.00% { transform: translate(250px,84px); } 36.00% { transform: translate(0px,112px); } 43.00% { transform: translate(322px,112px); } 44.00% { transform: translate(0px,140px); } 51.00% { transform: translate(290px,140px); } 52.00% { transform: translate(0px,168px); } 59.00% { transform: translate(180px,168px); } 90% { transform: translate(180px,168px); } 98%,100% { transform: translate(0px,0px); } }
    .pen { animation: pen 9s linear infinite; }
    @keyframes foot { 0%,19.00% { opacity: 0; transform: scale(.4); } 22.00%,88% { opacity: 1; transform: scale(1); } 94%,100% { opacity: 0; transform: scale(.6); } }
    .foot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: foot 9s cubic-bezier(.2,.9,.3,1.4) infinite; }
    @keyframes c0 { 0%,10.00% { opacity: 0; transform: translateY(10px) scale(.92); } 14.00%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; transform: scale(.96); } }
    @keyframes t0 { 0%,12.00% { stroke-dashoffset: 20; } 16.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 20; } }
    .c0 { opacity: 0; transform-box: fill-box; transform-origin: center; animation: c0 9s cubic-bezier(.2,.9,.3,1.3) infinite; } .t0 { stroke-dasharray: 20; stroke-dashoffset: 20; animation: t0 9s ease-out infinite; }
    @keyframes c1 { 0%,22.00% { opacity: 0; transform: translateY(10px) scale(.92); } 26.00%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; transform: scale(.96); } }
    @keyframes t1 { 0%,24.00% { stroke-dashoffset: 20; } 28.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 20; } }
    .c1 { opacity: 0; transform-box: fill-box; transform-origin: center; animation: c1 9s cubic-bezier(.2,.9,.3,1.3) infinite; } .t1 { stroke-dasharray: 20; stroke-dashoffset: 20; animation: t1 9s ease-out infinite; }
    @keyframes c2 { 0%,34.00% { opacity: 0; transform: translateY(10px) scale(.92); } 38.00%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; transform: scale(.96); } }
    @keyframes t2 { 0%,36.00% { stroke-dashoffset: 20; } 40.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 20; } }
    .c2 { opacity: 0; transform-box: fill-box; transform-origin: center; animation: c2 9s cubic-bezier(.2,.9,.3,1.3) infinite; } .t2 { stroke-dasharray: 20; stroke-dashoffset: 20; animation: t2 9s ease-out infinite; }
    @keyframes c3 { 0%,46.00% { opacity: 0; transform: translateY(10px) scale(.92); } 50.00%,90% { opacity: 1; transform: none; } 96%,100% { opacity: 0; transform: scale(.96); } }
    @keyframes t3 { 0%,48.00% { stroke-dashoffset: 20; } 52.00%,90% { stroke-dashoffset: 0; } 96%,100% { stroke-dashoffset: 20; } }
    .c3 { opacity: 0; transform-box: fill-box; transform-origin: center; animation: c3 9s cubic-bezier(.2,.9,.3,1.3) infinite; } .t3 { stroke-dasharray: 20; stroke-dashoffset: 20; animation: t3 9s ease-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .card1 { animation: bob 6s ease-in-out infinite; } .card2 { animation: bob 7s ease-in-out infinite reverse; }
    @keyframes blink { 50% { opacity: 0; } } .blink { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .l0,.l1,.l2,.l3,.l4,.l5,.l6,.t0,.t1,.t2,.t3 { stroke-dashoffset: 0; } .c0,.c1,.c2,.c3,.foot { opacity: 1; } .pen { transform: translate(180px,168px); } }
  </style>
  <rect y="0" width="1280" height="440" fill="url(#bg)"/>
  <rect y="0" width="1280" height="440" fill="url(#dots)"/>

  <text x="70" y="150" font-size="84" font-weight="700" fill="#F3EEE4" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" letter-spacing="-1.5">ABA-Setup<tspan class="blink" fill="#F59E0B">.</tspan></text>
  <text x="72" y="202" font-size="24" fill="#A9B4AE" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Deine ABA, Schritt für Schritt – belegt und offengelegt.</text>
  <text x="72" y="240" font-size="15" fill="#A9B4AE" fill-opacity="0.85" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.5">Für Claude und ChatGPT · Abschließende Arbeit an der AHS</text>

